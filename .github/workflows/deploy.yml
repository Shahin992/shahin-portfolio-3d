# Builds the portfolio and publishes it on Cloudflare: the files go to the R2 bucket, then the Worker that
# serves them is deployed. Runs on every push to the production branch (for example after merging main),
# or by hand from the Actions tab. One-time setup: DEPLOY.md.
# Every problem is written in plain words in the run's summary (Annotations), so the logs are rarely needed.
name: Deploy portfolio (R2 + Worker)

on:
  push:
    branches: [production]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cancelling it halfway
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build the site (fails on any page check)
        run: node build.mjs

      - name: Test the Worker against the built site
        run: node tools/test-worker.mjs

      # Tests the four secrets, the token's permissions, the zone and DNS, and creates the R2 bucket if missing
      - name: Check the Cloudflare setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: node tools/check-cloudflare.mjs

      - name: Upload changed files to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'shahin-portfolio' }}
        run: node tools/deploy.mjs

      # Wrangler through npx, so npm installs it with the workerd binary for this machine
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 deploy 2>&1 | tee wrangler.log; then
            msg=$(grep -E '✘|ERROR|[Ee]rror' wrangler.log | head -4 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Worker deploy failed::${msg:-Open the Deploy the Worker step for the details.}"
            exit 1
          fi

      - name: Tell search engines which pages changed (IndexNow)
        continue-on-error: true
        run: node tools/indexnow.mjs
